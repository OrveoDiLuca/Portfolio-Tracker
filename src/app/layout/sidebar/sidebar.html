<aside class="h-full w-64 flex flex-col border-r border-slate-800 p-4 bg-slate-950 text-white">
  <div class="flex items-center gap-3 mb-8">
    <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold">L</div>
    <span class="font-semibold text-lg">Ledger</span>
  </div>

  <nav class="flex flex-col gap-1">
    <a routerLink="/" routerLinkActive="bg-blue-950/60 text-white font-medium"
      [routerLinkActiveOptions]="{ exact: true }" #dashboardLink="routerLinkActive"
      class="flex items-center gap-2 px-3 py-2 rounded-md bg-blue-950/60 text-white font-medium hover:text-white hover:bg-slate-900">
      <span class="w-1.5 h-1.5 rounded-full bg-blue-500" [class.bg-blue-500]="dashboardLink.isActive"
        [class.bg-transparent]="!dashboardLink.isActive"></span>
      Dashboard
    </a>
    <a routerLinkActive="bg-blue-950/60 text-white font-medium" routerLink="/positions"
      #positionsLink="routerLinkActive"
      class="flex items-center gap-2 px-3 py-2 rounded-md text-slate-400 hover:text-white hover:bg-slate-900">
      <span class="w-1.5 h-1.5 rounded-full" [class.bg-blue-500]="positionsLink.isActive"
        [class.bg-transparent]="!positionsLink.isActive"></span>
      Positions
    </a>
  </nav>

  <button type="button" (click)="goToAddPosition()"
    class="mt-10 border border-blue-800 text-blue-400 rounded-md px-3 py-2 text-sm hover:bg-blue-950/40 cursor-pointer">
    + Add Position
  </button>

  <div class="mt-auto pt-4 border-t border-slate-800 text-xs text-slate-500">
    SIMULATED DATA<br />
    Prices fixed for demo purposes
  </div>
</aside>
