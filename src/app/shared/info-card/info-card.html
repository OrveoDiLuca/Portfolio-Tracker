<div class="bg-slate-900 border border-slate-800 rounded-lg p-5">
    <p class="text-slate-400 text-sm">{{ label() }}</p>
    <p class="text-2xl font-bold font-mono mt-1" [class.text-white]="tone() === 'default'"
        [class.text-green-400]="tone() === 'positive'" [class.text-red-400]="tone() === 'negative'">
        {{ value() }}
    </p>
    @if (sublabel()) {
    <p class="text-sm font-mono" [class.text-green-400]="tone() === 'positive'"
        [class.text-red-400]="tone() === 'negative'">
        {{ sublabel() }}
    </p>
    }
</div>
